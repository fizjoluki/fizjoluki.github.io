<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1b365d">
<meta name="description" content="{{ .Description | default site.Params.description }}">
<meta name="author" content="{{ site.Params.author }}">
{{ with site.Params.copyright }}<meta name="copyright" content="{{ . }}">{{ end }}
{{ with site.Params.rights }}<meta name="rights" content="{{ . }}">{{ end }}
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<link rel="icon" href="{{ "logo.png" | relURL }}" type="image/png">
{{ with resources.Get "css/main.css" }}
  {{ $styles := . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
{{ end }}

<!-- Inline override to ensure hero image is cropped as intended (higher priority than cached CSS) -->
<style>
  .hero { min-height: 30rem; }
  .hero-media img { object-position: 48% 80% !important; }
  @media (max-width: 760px) {
    .hero-media img { object-position: 48% 78% !important; }
  }
  @media (max-width: 460px) {
    .hero-media img { object-position: 48% 86% !important; }
  }
</style>
