<!doctype html>
<html lang="{{ site.Language.Locale | default "pl-PL" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Główna nawigacja">
        <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} strona główna">
          <img src="{{ "logo.png" | relURL }}" width="164" height="106" alt="{{ site.Title }}">
        </a>
        <div class="nav-menu">
          <input class="nav-toggle" type="checkbox" id="nav-toggle">
          <label class="nav-menu-trigger" for="nav-toggle">
            <span>Menu</span>
            <span class="menu-icon" aria-hidden="true"></span>
          </label>
          <div class="nav-links">
            <a href="{{ "#oferta" | relURL }}">Oferta</a>
            <a href="{{ "#cennik" | relURL }}">Cennik</a>
            <a href="{{ "#o-mnie" | relURL }}">O mnie</a>
            <a href="{{ "#kontakt" | relURL }}">Kontakt</a>
          </div>
        </div>
      </nav>
    </header>
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
