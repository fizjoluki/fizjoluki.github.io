<!doctype html>
<html lang="{{ site.Language.Locale | default "pl-PL" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Główna nawigacja">
        <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} strona główna">
          {{ partial "icon.html" "shield" }}
          <span class="brand-text">SecurityCenter</span>
        </a>
        <div class="nav-links">
          <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="Zmień tryb kolorów" aria-pressed="false">
            <span class="theme-toggle-icon theme-toggle-icon-dark" aria-hidden="true">{{ partial "icon.html" "moon" }}</span>
            <span class="theme-toggle-icon theme-toggle-icon-light" aria-hidden="true">{{ partial "icon.html" "sun" }}</span>
          </button>
          <div class="user-avatar">
            {{ partial "icon.html" "user" }}
          </div>
        </div>
      </nav>
    </header>
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
